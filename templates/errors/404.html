{% extends 'base.html' %}

{% block title %}404 Page Not Found - QueryLearn{% endblock %}

{% block content %}
<div class="container fade-in" style="display: flex; justify-content: center; align-items: center; min-height: 70vh;">
    <div class="card text-center" style="max-width: 600px; width: 100%; padding: 50px 20px; background: transparent; border: none;">
        <h1 style="font-size: 6em; font-weight: 800; margin-bottom: 0; background: var(--gradient-brand); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">404</h1>
        
        <h2 style="margin-bottom: 20px; font-size: 2em;">Page Not Found</h2>
        
        <p style="font-size: 1.1em; color: var(--text-muted); margin-bottom: 40px;">
            The requested page could not be located in the QueryLearn system.
        </p>

        <a href="{{ url_for('index') }}" class="btn btn-primary btn-lg">Return Home</a>
    </div>
</div>
{% endblock %}
