<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Analytics — QueryLearn Case Study</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="db-page">
    <!-- Left Navigation Sidebar -->
    <aside class="db-sidebar">
        <a href="{{ url_for('dashboard.overview') }}" class="db-brand">
            <div class="db-brand-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                    <circle cx="11" cy="11" r="8" stroke="#ffffff" stroke-width="2.5"/>
                    <line x1="16.5" y1="16.5" x2="22" y2="22" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
                </svg>
            </div>
            <span class="db-brand-text">QueryLearn</span>
        </a>

        <nav class="db-nav">
            <a href="{{ url_for('dashboard.overview') }}" class="db-nav-link">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                <span>Console Overview</span>
            </a>
            <a href="{{ url_for('dashboard.participants') }}" class="db-nav-link">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                <span>Participant Registry</span>
            </a>
            <a href="{{ url_for('dashboard.results') }}" class="db-nav-link">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
                <span>Task Telemetry</span>
            </a>
            <a href="{{ url_for('dashboard.benchmarks') }}" class="db-nav-link">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                <span>Engine Benchmarks</span>
            </a>
            <a href="{{ url_for('dashboard.export', type='all') }}" class="db-nav-link">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                <span>Export Dataset</span>
            </a>
            <div style="margin-top: auto; padding-top: 1rem; border-top: 1px solid rgba(255,255,255,0.06);">
                <a href="{{ url_for('auth.logout') }}" class="db-nav-link" style="color: #ef4444;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                    <span>Sign Out</span>
                </a>
            </div>
        </nav>
    </aside>

    <!-- Main Viewport -->
    <main class="db-main">
        <!-- Topbar -->
        <header class="db-topbar">
            <h1 class="db-title">Visual Analytics</h1>

            <div class="db-topbar-tools">
                <div class="db-user">
                    <div class="db-user-avatar">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    </div>
                </div>
            </div>
        </header>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 2rem;">
            <div class="db-editor-card" style="padding: 1.5rem;">
                <h3 style="color: white; margin-bottom: 1rem;">Success Rate Comparison</h3>
                <div style="position: relative; height: 260px; width: 100%;">
                    <canvas id="successChart"></canvas>
                </div>
            </div>
            
            <div class="db-editor-card" style="padding: 1.5rem;">
                <h3 style="color: white; margin-bottom: 1rem;">Mean Duration Comparison</h3>
                <div style="position: relative; height: 260px; width: 100%;">
                    <canvas id="durationChart"></canvas>
                </div>
            </div>
            
            <div class="db-editor-card" style="padding: 1.5rem;">
                <h3 style="color: white; margin-bottom: 1rem;">Overall Success Rate</h3>
                <div style="position: relative; height: 260px; width: 100%;">
                    <canvas id="overallSuccessChart"></canvas>
                </div>
            </div>
            
            <div class="db-editor-card" style="padding: 1.5rem;">
                <h3 style="color: white; margin-bottom: 1rem;">Attempt Distribution</h3>
                <div style="position: relative; height: 260px; width: 100%;">
                    <canvas id="attemptChart"></canvas>
                </div>
            </div>
        </div>
        
        <p style="text-align: center; color: #64748b; font-size: 0.9rem;">Charts render from live database telemetry</p>

    </main>
</div>

<script>
    Chart.defaults.color = '#94a3b8';
    Chart.defaults.borderColor = 'rgba(255, 255, 255, 0.1)';

    const tasks = {{ m.tasks | tojson }};
    const labels = tasks.map(t => t.task_id);
    
    // 1. Success Rate Comparison
    new Chart(document.getElementById('successChart'), {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [
                {
                    label: 'SQL Success (%)',
                    data: tasks.map(t => t.sql_success || 0),
                    backgroundColor: '#3b82f6'
                },
                {
                    label: 'Python Success (%)',
                    data: tasks.map(t => t.python_success || 0),
                    backgroundColor: '#8b5cf6'
                }
            ]
        },
        options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, max: 100 } } }
    });

    // 2. Mean Duration Comparison
    new Chart(document.getElementById('durationChart'), {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [
                {
                    label: 'SQL Time (s)',
                    data: tasks.map(t => t.sql_time || 0),
                    backgroundColor: '#3b82f6'
                },
                {
                    label: 'Python Time (s)',
                    data: tasks.map(t => t.python_time || 0),
                    backgroundColor: '#8b5cf6'
                }
            ]
        },
        options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true } } }
    });
    
    // 3. Overall Success Rate
    new Chart(document.getElementById('overallSuccessChart'), {
        type: 'doughnut',
        data: {
            labels: ['SQL', 'Python'],
            datasets: [{
                data: [{{ m.sql_success_rate }}, {{ m.python_success_rate }}],
                backgroundColor: ['#3b82f6', '#8b5cf6'],
                borderWidth: 0
            }]
        },
        options: { responsive: true, maintainAspectRatio: false }
    });

    // 4. Attempt Distribution
    new Chart(document.getElementById('attemptChart'), {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [
                {
                    label: 'SQL Attempts',
                    data: tasks.map(t => t.sql_attempts || 0),
                    backgroundColor: '#3b82f6'
                },
                {
                    label: 'Python Attempts',
                    data: tasks.map(t => t.python_attempts || 0),
                    backgroundColor: '#8b5cf6'
                }
            ]
        },
        options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true } } }
    });
</script>

</body>
</html>
